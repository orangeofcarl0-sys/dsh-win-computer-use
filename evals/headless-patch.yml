# headless S4 探针叠加层：启用 credentials，插入本插件。
# 前置：headless profile 的 node_modules 里有 dsh-win-computer-use（junction/安装）。
# 模型使用 dsh 默认 deepseek-official/deepseek-flash；如需换模型，覆盖 agent-default-model。
- id: credentials
  disabled: false

# 固定主 agent 模型身份，便于报告审计；dsh 0.2.2 不支持 seed/top_p，
# temperature 也不在 patch 配置键里，重复测试仍需按统计分布解读。
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash

- insert:
    - id: dsh-win-computer-use
      name: dsh-win-computer-use
      config:
        surfaceMode: dispatcher
        ttlMs: 60000
        maxElements: 120
        passwordScan: off
        deliveryMode: background
